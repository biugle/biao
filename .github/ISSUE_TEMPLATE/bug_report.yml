name: Bug report
description: 报告可复现的问题
title: "[Bug] "
labels: ["bug"]
body:
  - type: textarea
    id: reproduction
    attributes:
      label: 复现步骤
      description: 请提供最小复现和实际/预期结果。
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: 版本或 commit
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: 环境
      description: Node、pnpm、浏览器、操作系统和项目模式。
    validations:
      required: true

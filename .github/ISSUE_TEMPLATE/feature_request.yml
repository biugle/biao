name: Feature request
description: 提议可复用的基座或 CLI 能力
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: 要解决的问题
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 建议方案
      description: 请说明 API、兼容性、Demo 和文档影响。
    validations:
      required: true
